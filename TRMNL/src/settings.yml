---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: '{"snow_conditions": {"resort_name": "Les Saisies", "region_path": "/les-saisies/", "snow_mountain": "60", "elevation_mountain": 2069, "snow_valley": "36", "elevation_valley": 1150, "last_update": "20.12.2025", "snow_condition": "keine Meldung", "last_snowfall": "18.12.2025", "avalanche_warning": "II - mäßig", "lifts_open_count": 29, "lifts_total_count": 30, "slopes_open_km": 55, "slopes_total_km": 77, "slopes_open_count": 51, "slopes_total_count": 60, "slope_condition": "keine Meldung", "status": "Open"}}'
polling_verb: get
framework_version: 3.4.4
serverless_language: node
refresh_interval_floor: '360'
polling_url: "{{ resort_url }}"
polling_headers: ''
polling_body: ''
id: 219253
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: doesnt_matter
  name: LiftRadar - Ski resorts snow report
  category: travel,custom
  field_type: author_bio
  description: Show opened lifts, slopes and snow report for your favourite ski resort. This plugin uses data from https://liftradar.eu. Visit that website, find your desired ski resort, copy link to JSON file and put into pulling url in plugin config
  github_url: https://github.com/mironiasty/trmnl_snow_conditions
- keyname: resort_url
  name: Resort
  field_type: string
  description: The JSON link of your ski resort on liftradar.eu.
  help_text: Open <a href="https://liftradar.eu" target="_blank">https://liftradar.eu</a>, search for your resort, open it and copy JSON path from data box on the right It looks like <code>https://liftradar.eu/json/at/soelden.json</code>.
  placeholder: https://liftradar.eu/json/at/hintertux.json
name: Ski Resort Snow Report
description: Opened slopes/lifts in ski resorts
refresh_interval: 360
